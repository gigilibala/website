name: Deploy to Firebase Hosting on PR

on:
  pull_request_target:
    branches:
      - main

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Packages
        run: yarn --immutable

      - name: Setup Config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Next.js keeps app code in app/; the Astro site uses src/.
          dir=src
          [ -d app ] && dir=app
          printf "$FIREBASE_CONFIG" | base64 -d > "$dir/firebase.config.ts"

      - name: Lint Check
        run: yarn lint:check

      - name: Build Website
        run: yarn build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_C9EAF }}'
          projectId: personal-website-c9eaf
