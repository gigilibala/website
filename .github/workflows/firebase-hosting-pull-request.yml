# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on:
  pull_request_target:
    branches:
      - main

env:
  WIF_PROVIDER: projects/810566235090/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@aminhassani-prd.iam.gserviceaccount.com

jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Packages
        run: yarn --immutable

      - name: Setup Config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Next.js keeps app code in app/; the Astro site uses src/.
          dir=src
          [ -d app ] && dir=app
          printf "$FIREBASE_CONFIG" | base64 -d > "$dir/firebase.config.ts"

      - name: Lint Check
        run: yarn lint:check

      - name: Build Website
        run: yarn build

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy preview channel
        id: deploy
        run: |
          output=$(yarn firebase hosting:channel:deploy pr-${{ github.event.number }} --project aminhassani-prd --json)
          url=$(echo "$output" | jq -r '.result|to_entries[0].value.url')
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Post preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- firebase-preview -->';
            const body = `${marker}\n🔥 **Firebase Preview:** ${url}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The main ruleset also requires a check named "Deploy Preview". The Firebase
  # action used to post it; this job keeps that name passing.
  deploy_preview:
    name: Deploy Preview
    needs: build_and_preview
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "Preview deployed"
