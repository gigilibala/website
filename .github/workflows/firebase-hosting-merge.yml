# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual runs; like pushes, they deploy only when a new release is cut.
  workflow_dispatch:

# Deploy one release at a time; a newer merge waits instead of racing.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Packages
        run: yarn --immutable

      - name: Setup Config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Next.js keeps app code in app/; the Astro site uses src/.
          dir=src
          [ -d app ] && dir=app
          printf "$FIREBASE_CONFIG" | base64 -d > "$dir/firebase.config.ts"

      - name: Lint Check
        run: yarn lint:check

      - name: Build Website with Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WEBSITE_C9EAF }}'
          channelId: live
          projectId: personal-website-c9eaf
