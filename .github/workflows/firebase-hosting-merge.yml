# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  # Manual runs; like pushes, they deploy only when a new release is cut.
  workflow_dispatch:

# Deploy one release at a time; a newer merge waits instead of racing.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/810566235090/locations/global/workloadIdentityPools/github-actions/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@aminhassani-prd.iam.gserviceaccount.com

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Packages
        run: yarn --immutable

      - name: Setup Config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          # Next.js keeps app code in app/; the Astro site uses src/.
          dir=src
          [ -d app ] && dir=app
          printf "$FIREBASE_CONFIG" | base64 -d > "$dir/firebase.config.ts"

      - name: Lint Check
        run: yarn lint:check

      - name: Build Website with Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v3
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        if: steps.semantic.outputs.new_release_published == 'true'
        run: yarn firebase deploy --only hosting --project aminhassani-prd --non-interactive
